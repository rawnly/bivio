[tools]
goreleaser = "latest"
mr-boxington = { version = "latest", workflow = "release.yml@refs/heads/main" }
rust = { version = "latest", profile = "default" }
rust-analyzer = "latest"

[tasks.install]
run = "cargo install --path ."

[tasks.build]
run = "cargo build --release"

[tasks.check]
run = "cargo check"

[tasks.release]
run = "goreleaser build"

[tasks.snapshot]
run = "goreleaser build --snapshot --clean"
