name: Release

on:
  push:
    tags: ['v*']

permissions:
  contents: read

jobs:
  build:
    name: Build ${{ matrix.target }}
    runs-on: ${{ matrix.runner }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: ubuntu-latest
            target: x86_64-unknown-linux-gnu
          - runner: macos-15-intel
            target: x86_64-apple-darwin
          - runner: macos-latest
            target: aarch64-apple-darwin
          - runner: windows-latest
            target: x86_64-pc-windows-msvc
    steps:
      - uses: actions/checkout@v4
      - name: Check tag matches package version
        shell: bash
        run: |
          version=$(cargo metadata --locked --no-deps --format-version 1 | python -c 'import json,sys; print(json.load(sys.stdin)["packages"][0]["version"])')
          test "$GITHUB_REF_NAME" = "v$version" || { echo "Tag must match Cargo.toml version v$version"; exit 1; }
      - name: Build
        run: cargo build --locked --release --target ${{ matrix.target }}
      - name: Package
        shell: bash
        run: |
          mkdir -p dist
          binary=bvo
          if [[ "$RUNNER_OS" == Windows ]]; then binary=bvo.exe; fi
          tar -czf "dist/bvo-${{ matrix.target }}.tar.gz" -C "target/${{ matrix.target }}/release" "$binary"
      - uses: actions/upload-artifact@v4
        with:
          name: bvo-${{ matrix.target }}
          path: dist/*.tar.gz
          if-no-files-found: error

  publish:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
      id-token: write
      attestations: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          pattern: bvo-*
          path: dist
          merge-multiple: true
      - name: Create draft release and upload archives
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          TAG: ${{ github.ref_name }}
        run: |
          if gh release view "$TAG" --json isDraft --jq .isDraft > /tmp/release-draft; then
            if [ "$(< /tmp/release-draft)" != true ]; then
              echo "Release $TAG is already published; refusing to replace its assets" >&2
              exit 1
            fi
          else
            args=(--draft --verify-tag --generate-notes)
            if [[ "$TAG" == *-* ]]; then args+=(--prerelease); fi
            gh release create "$TAG" "${args[@]}"
          fi
          gh release upload "$TAG" dist/*.tar.gz --clobber
      - name: Sign release manifest
        uses: jdx/packslip@v1
        with:
          artifacts: dist/*.tar.gz
          bin: bvo
      - name: Publish release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          TAG: ${{ github.ref_name }}
        run: gh release edit "$TAG" --draft=false
